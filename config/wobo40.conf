# ---- 省電力 ----
CONFIG_ZMK_SLEEP=y
# 30分操作がなければディープスリープ
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---- ポインティングデバイス (PMW3610 トラックボール) ----
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_PMW3610=y

# 感度 (200〜3200, 200刻み)。速すぎる場合は CPI を下げるか DIVIDOR を増やす
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1

# スクロール量の間引き (大きいほどスクロールが遅くなる)
CONFIG_PMW3610_SCROLL_TICK=20

# オートマウスレイヤーの解除時間 (ms)
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=400

# ---- センサー実装向きの調整 (必要に応じてコメントアウトを外す) ----
# CONFIG_PMW3610_ORIENTATION_90=y
# CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_ORIENTATION_270=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
