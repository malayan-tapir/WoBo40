# ---- NFCピン D14/D15 (P0.09/P0.10) をマトリクス用GPIOとして使う ----
CONFIG_NFCT_PINS_AS_GPIOS=y

# ---- 省電力 ----
CONFIG_ZMK_SLEEP=y
# 30分操作がなければディープスリープ
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---- ポインティングデバイス (PAW3222 トラックボール) ----
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_PAW3222=y

# スクロール/オートマウスは overlay の input-processor 側で定義
# (scroll-layers / automouse-layer は PAW3222 ドライバには無いため)

# 感度(CPI)は overlay の res-cpi で設定。範囲 608〜4826 (38刻み)。
# X/Y やスクロールの反転はキーマップ側の input processor で行う。
